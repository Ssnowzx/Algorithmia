name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Os vetores-ouro rodam contra o jogo em PHP puro, sobre MySQL. Enquanto o port
  # não terminar, é este job que define o que "certo" significa: o motor novo tem
  # de reproduzir estes mesmos números.
  legado:
    name: Motor legado (vetores-ouro)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: raiz
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz"
          --health-interval=5s --health-timeout=5s --health-retries=15

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: raiz

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - name: Preparar o banco de teste
        # schema.sql tem CREATE DATABASE/USE fixos em `algorithmia` e ignora o
        # DB_NAME do ambiente — por isso as duas instruções são removidas aqui.
        run: |
          mysql -h 127.0.0.1 -uroot -praiz -e "CREATE DATABASE algorithmia_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sed -e '/^CREATE DATABASE IF NOT EXISTS algorithmia/,+2d' -e '/^USE algorithmia;/d' database/schema.sql \
            | mysql -h 127.0.0.1 -uroot -praiz algorithmia_test

      - run: vendor/bin/phpunit

  platform:
    name: Port Laravel (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: algorithmia_test
          POSTGRES_USER: algorithmia
          POSTGRES_PASSWORD: segredo_local
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U algorithmia -d algorithmia_test"
          --health-interval=5s --health-timeout=5s --health-retries=15

    env:
      # O phpunit.xml aponta para a porta 55433 do docker-compose local; as tags
      # <env> do PHPUnit não sobrescrevem variáveis já definidas, então aqui o
      # serviço do runner vence.
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatação (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (PHPStan nível 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Testes
        run: php artisan test

  # A imagem de produção precisa CONSTRUIR e o jogo precisa estar jogável dentro
  # dela. Um CI que só roda testes não pega um Dockerfile quebrado, nem uma
  # extensão PHP que falta, nem um entrypoint que aceita APP_KEY vazio.
  imagem:
    name: Imagem de produção
    runs-on: ubuntu-latest
    needs: platform

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: algorithmia
          POSTGRES_USER: algorithmia
          POSTGRES_PASSWORD: segredo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U algorithmia -d algorithmia"
          --health-interval=5s --health-timeout=5s --health-retries=15

    steps:
      - uses: actions/checkout@v5

      - name: Construir a imagem
        run: docker build --file platform/docker/php/Dockerfile --tag algorithmia:ci .

      - name: O entrypoint recusa APP_KEY vazio
        run: |
          if docker run --rm algorithmia:ci php artisan --version; then
            echo "::error::a imagem subiu sem APP_KEY"; exit 1
          fi

      - name: O entrypoint recusa APP_DEBUG em produção
        run: |
          if docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" \
               -e APP_ENV=production -e APP_DEBUG=true algorithmia:ci php artisan --version; then
            echo "::error::a imagem subiu com APP_DEBUG=true em produção"; exit 1
          fi

      - name: Migrar e rodar o smoke estrutural
        # As 14 tabelas, o driver de sessão e o APP_DEBUG valem mesmo num banco
        # vazio. O smoke completo (que joga uma fase) precisa do conteúdo
        # importado, e isso só existe em produção.
        run: |
          CHAVE="base64:$(openssl rand -base64 32)"
          COMUM=(--rm --network host
            -e "APP_KEY=$CHAVE" -e APP_ENV=production -e APP_DEBUG=false
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432
            -e DB_DATABASE=algorithmia -e DB_USERNAME=algorithmia -e DB_PASSWORD=segredo_ci)

          docker run "${COMUM[@]}" algorithmia:ci php artisan migrate --force
          docker run "${COMUM[@]}" algorithmia:ci php artisan algorithmia:smoke --sem-conteudo
