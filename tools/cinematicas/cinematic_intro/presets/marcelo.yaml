narracao: |
  A jornada entra na Floresta das Estruturas, e dela só atravessa quem respeita a ordem das coisas.

  Marcelo, o Andarilho, cruza essas matas no seu velho carro quadrado e cinza.

  Ele mede cada caminho pelo preço que cobra, porque a escolha errada transforma um passeio numa eternidade.

  Marcelo já levou um aluno nessa estrada. Esperto, mas só queria o atalho, nunca o trajeto.

  Hoje esse aluno mora lá embaixo, no fundo do buraco. Aperte o cinto.

