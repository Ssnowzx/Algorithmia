narracao: |
  No fim de tudo, onde o código termina, abre-se o Abismo: o vazio que engole quem entrega a própria alma.

  Lá no fundo espera Márcio. Um dia ele foi Zero, o primeiro aluno dos cinco mestres.

  Brilhante, e tão dependente das respostas prontas que, quando elas se calaram, não restou ninguém por dentro.

  Ele é o espelho do que você ainda pode se tornar. O Fragmento continua sussurrando.

  A última escolha é só sua: repetir a história dele, ou provar que ela podia terminar de outro jeito.

