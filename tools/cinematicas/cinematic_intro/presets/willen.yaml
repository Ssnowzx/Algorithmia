narracao: |
  A estrada deixa a vila para trás e leva ao Porto da Sintaxe, erguido sobre os escombros do dia em que tudo quase ruiu.

  Aqui vive Willen, o Arquiteto. Dizem que ele lê um sistema inteiro só de olhar.

  A regra dele é simples, e ninguém gosta de ouvir: antes de sair correndo, aprenda a alinhar cada passo.

  Willen já teve um aluno como você. Brilhante. Rápido demais. Nunca alinhou a própria vida, e desabou.

  O Fragmento ainda sussurra no seu ouvido. Cabe a você decidir se escuta.

