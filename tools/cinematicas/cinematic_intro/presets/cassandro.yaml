narracao: |
  A estrada termina numa torre de sete andares: a Torre das Conexões, por onde passa toda mensagem do reino.

  Cassandro, o Mensageiro, garante que nada se perca no caminho. Fala alto, ri fácil.

  E pede só uma coisa: que você responda quando for chamado.

  Porque a pior perda da vida dele foi um aluno que parou de responder.

  Mandou mensagem, mandou mais, mandou a torre inteira. Só recebeu silêncio. Não vire mais um silêncio.

