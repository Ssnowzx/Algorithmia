narracao: |
  Depois do porto, ergue-se a Cidadela dos Objetos, onde tudo nasce de um molde e ganha forma própria.

  Quem governa aqui é Clayton, o Moldador, de sorriso tranquilo e paciência infinita.

  Ele ensina a não copiar o pronto: herde a ideia, mas componha a sua própria solução.

  Clayton se lembra de um pupilo que nunca compôs nada. Só repetia respostas de uma fonte que não entendia.

  Fazia tudo, e não era ninguém. Não seja apenas o molde dos moldes dos outros.

