narracao: |
  Mais um escolhido.

  O Fragmento te achou... ou só caiu na primeira mão disponível.

  Tanto faz. Agora o problema é seu.

  Houve um tempo em que uma inteligência artificial respondia perguntas.

  Aí todo mundo esqueceu como pensar... e o mundo quase virou um belo erro quinhentos.

  Bem-vindo à Vila Hello World.

  De novo.

  Todo herói começa aqui.

  Sua história começa agora... ou a repetição dela.

