narracao: |
  A trilha sobe até o alto gelado da Montanha do Cálculo, onde tudo no mundo tem um limite.

  César, o Oráculo, escuta o ritmo dos números, e foi o primeiro a sentir o frio que sobe do abismo lá embaixo.

  É aqui que ele conta a verdade que os outros calaram.

  O senhor do vazio, que ameaça o reino, um dia foi um aluno. O melhor de todos.

  E quando César olha pra você, vê o mesmo olhar faminto. Reze pra que seja só coincidência.

