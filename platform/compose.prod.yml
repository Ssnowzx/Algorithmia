# Produção. Suba com `bin/deploy.sh`, nunca à mão: o script cuida da ordem, das
# migrations e do rollback quando o health check falha.
#
# A tag da imagem é o SHA do commit. Rollback é apontar `ALGORITHMIA_TAG` para a
# tag anterior e subir de novo — nenhum rebuild, nenhum `git checkout` no servidor.

name: algorithmia

services:
  app:
    image: algorithmia:${ALGORITHMIA_TAG:?defina ALGORITHMIA_TAG (use bin/deploy.sh)}
    restart: unless-stopped
    env_file: [.env.producao]
    # No dia do corte, `algorithmia:importar` roda aqui dentro e precisa alcançar o
    # MySQL legado, que vive no host. O Docker Desktop resolve `host.docker.internal`
    # sozinho; no Linux da VPS, não — sem esta linha o import morre em "host
    # desconhecido". `host-gateway` faz o nome apontar para o gateway da bridge.
    #
    # Não basta: o MySQL do legado precisa escutar nessa interface (não só em
    # 127.0.0.1) e conceder SELECT ao usuário vindo da sub-rede do Docker. Ver §8.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # A arte fica fora da imagem: 143 MB imutáveis em cada release tornariam o
      # deploy lento e o rollback caro.
      - ../public/img:/var/www/html/public/img:ro
      - storage:/var/www/html/storage
    healthcheck:
      # `php -r 'exit(0)'` só provaria que o binário existe. O que importa é o app
      # conseguir falar com o banco.
      #
      # PDO cru, e não `artisan tinker`: bootar o framework inteiro a cada 10s só
      # para um `SELECT 1` é caro, e um `config:cache` corrompido faria o
      # healthcheck acusar o banco por um problema que não é dele.
      test: ["CMD-SHELL", "php -r 'new PDO(\"pgsql:host=\".getenv(\"DB_HOST\").\";dbname=\".getenv(\"DB_DATABASE\"), getenv(\"DB_USERNAME\"), getenv(\"DB_PASSWORD\"));' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${ALGORITHMIA_PORTA:-8080}:80"
    volumes:
      - ./docker/nginx/algorithmia.conf:/etc/nginx/conf.d/default.conf:ro
      # O nginx serve os estáticos direto do disco, sem passar pelo PHP. Precisa
      # ver os mesmos arquivos que o app.
      - ../public/img:/var/www/html/public/img:ro
      - ./public:/var/www/html/public:ro
    healthcheck:
      # 127.0.0.1, e não `localhost`: o wget do BusyBox resolve `localhost` para ::1
      # primeiro, e este nginx só escuta em IPv4. O healthcheck nunca passaria.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: [.env.producao.postgres]
    volumes:
      # PostgreSQL 18 mudou a convenção: o mount vai em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  storage:
