; Produção. O OPcache é a diferença entre um jogo que responde e um que engasga.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; A imagem é imutável: o código nunca muda sob os pés do OPcache, então não há
; motivo para pagar um stat() por arquivo a cada requisição.
opcache.validate_timestamps = 0

; Um erro exibido a um aluno é um caminho de arquivo entregue a um atacante.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 8M
