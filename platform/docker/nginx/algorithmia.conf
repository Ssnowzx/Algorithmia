server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # O jogo serve HTML e imagens próprias, e nenhum script de terceiros. Um CSP
    # restritivo é barato aqui e caro depois.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # A arte é imutável e versionada por `?v=filemtime`. Cache longo, sem revalidar.
    location /img/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;

        # Não repassamos `HTTPS` a partir de X-Forwarded-Proto: o Symfony considera
        # segura qualquer variável `HTTPS` não-vazia e diferente de "off" — o valor
        # literal "http" seria lido como HTTPS. Quem decide o esquema é o Laravel,
        # via `trustProxies` (TRUSTED_PROXIES no .env.producao).
    }

    # Nada além do front controller executa PHP. Sem isto, um upload malicioso em
    # qualquer pasta servida viraria código.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles nunca são servidos — `.env`, `.git`, o que for.
    location ~ /\. {
        deny all;
    }
}
