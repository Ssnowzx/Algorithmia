# Modo 1 — HTTP numa porta alta, atrás de um proxy que termina o TLS.
#
# É a topologia da janela de coexistência: o `httpd` do legado é dono da 80/443 e
# repassa para cá. Exige `TRUSTED_PROXIES` no `.env.producao` (RUNBOOK §9).
#
# Para uma VPS dedicada, sem legado na frente, use `algorithmia-tls.conf`.

# `$scheme` é o que ESTE servidor terminou. Aqui é sempre http; o valor vazio faz o
# Symfony NÃO considerar a conexão segura, e a decisão fica com o `trustProxies`.
map $scheme $https_on {
    https on;
    default "";
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/comum.conf;
}
