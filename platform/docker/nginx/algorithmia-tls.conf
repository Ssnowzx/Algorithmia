# Modo 2 — o nginx do port é dono da 80/443 e termina o TLS ele mesmo.
#
# É a topologia de uma VPS dedicada, sem o `httpd` do legado na frente. Aqui
# `TRUSTED_PROXIES` fica **vazio**: não há proxy em quem confiar, e confiar em `*`
# deixaria qualquer cliente forjar `X-Forwarded-Proto`.
#
# Selecionado por `ALGORITHMIA_NGINX_CONF=algorithmia-tls.conf`, com os certificados
# montados em /etc/nginx/certs (ver RUNBOOK §10).

map $scheme $https_on {
    https on;
    default "";
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # A renovação do certbot precisa desta pasta servida em texto claro, na 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # O healthcheck do container fala HTTP em 127.0.0.1:80. Sem esta exceção ele
    # receberia o 301 abaixo, o `grep '"status":"ok"'` falharia, e o container ficaria
    # `unhealthy` para sempre — com o site funcionando perfeitamente.
    location = /healthz {
        try_files $uri /index.php?$query_string;
    }

    # Precisa vir antes do `location /`, e antes do `\.php$` que devolve 404: em
    # nginx, entre expressões regulares vence a primeira que casar.
    location ~ ^/index\.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https_on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;

    # Só depois de o HTTPS estar mesmo funcionando. Um HSTS emitido cedo demais
    # tranca os navegadores fora do site enquanto o certificado não presta.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/comum.conf;
}
