# Corpo compartilhado pelos dois modos (HTTP atrás de proxy, e TLS direto).
# Incluído DENTRO de um bloco `server`. Quem define `root`, `index` e os `listen`
# é o arquivo que inclui.

charset utf-8;
client_max_body_size 8m;

# O jogo serve HTML e imagens próprias, e nenhum script de terceiros. Um CSP
# restritivo é barato aqui e caro depois.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# A arte é imutável e versionada por `?v=filemtime`. Cache longo, sem revalidar.
location /img/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

location ~* \.(css|js|woff2|svg)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/index\.php$ {
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    # `$https_on` vem do `map $scheme` declarado no arquivo que inclui este. É o
    # esquema que ESTE nginx terminou — nunca um cabeçalho do cliente.
    #
    # Atrás do proxy do legado, `$scheme` é http, `$https_on` fica vazio, e quem
    # decide o esquema é o Laravel via `trustProxies`. O Symfony considera segura
    # qualquer variável `HTTPS` não-vazia e diferente de "off": repassar aqui o
    # `X-Forwarded-Proto` cru faria o valor literal "http" ser lido como HTTPS.
    fastcgi_param HTTPS $https_on;

    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 30s;
}

# Nada além do front controller executa PHP. Sem isto, um upload malicioso em
# qualquer pasta servida viraria código.
location ~ \.php$ {
    return 404;
}

# Dotfiles nunca são servidos — `.env`, `.git`, o que for.
location ~ /\. {
    deny all;
}
